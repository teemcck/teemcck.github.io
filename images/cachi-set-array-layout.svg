<text x="24" y="424" class="subtitle" text-anchor="start">A lookup only scans indices [start, end), so a set's boundaries come from arithmetic alone.</text>
<text x="24" y="444" class="subtitle" text-anchor="start">Every line in the array is the same small struct: tag, valid, dirty, insertion_time, last_access.</text>
